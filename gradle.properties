pluginGroup = dev.phaenon

# Oldest PhpStorm the plugin is built against and declares support for (2026.1.4 = build
# 261.26222): the first whose LSP API has the names that replace the ones deprecated since
# (LspIntegrationProvider, LspClientDescriptor, LspClientManager); 2026.1 to 2026.1.3 have only the
# old ones. Its language levels reach PHP 8.5, the floor of the language, as they do from 2025.3 on.
platformVersion = 2026.1.4
pluginSinceBuild = 261.26222

# The IDE ships its own Kotlin stdlib; bundling another copy is forbidden by the platform.
kotlin.stdlib.default.dependency = false
kotlin.code.style = official

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
