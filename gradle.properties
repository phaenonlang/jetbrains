pluginGroup = dev.phaenon

# Oldest PhpStorm the plugin is built against and declares support for (2025.3 = build 253):
# the first whose language levels reach PHP 8.5, the floor of the language, and the first whose
# LSP API has lspCustomization.
platformVersion = 2025.3
pluginSinceBuild = 253

# The IDE ships its own Kotlin stdlib; bundling another copy is forbidden by the platform.
kotlin.stdlib.default.dependency = false
kotlin.code.style = official

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
