pluginGroup = dev.phaenon
pluginVersion = 0.2.0

# Oldest PhpStorm the plugin is built against and declares support for (2025.1 = build 251).
platformVersion = 2025.1
pluginSinceBuild = 251

# The IDE ships its own Kotlin stdlib; bundling another copy is forbidden by the platform.
kotlin.stdlib.default.dependency = false
kotlin.code.style = official

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
